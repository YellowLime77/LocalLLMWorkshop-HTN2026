<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devpost Writer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Devpost Writer</h1>
            <p>Write your Devpost submission in seconds!</p>
        </header>

        <main>
            <div class="input-section">
                <label for="project_info">Project Info / README (Optional)</label>
                <textarea id="project_info" placeholder="Paste your readme, messy notes, or just a brain dump here..."></textarea>

                <label for="style">Formatting and Style (Optional)</label>
                <input type="text" id="style" placeholder="e.g., Professional, witty, use lots of emojis, etc.">

                <label for="instructions">Other Instructions (Optional)</label>
                <input type="text" id="instructions" placeholder="e.g., Highlight our use of local LLMs!">

                <button id="generate-btn" onclick="generate()">Write my submission!</button>
            </div>

            <div class="output-section">
                <h2>Generated Markdown</h2>
                <div id="loading" style="display: none;">Generating... this might take a moment!</div>
                <textarea id="output" readonly placeholder="Your generated Devpost submission will appear here..."></textarea>
            </div>
        </main>
    </div>

    <script>
        async function generate() {
            const btn = document.getElementById('generate-btn');
            const loading = document.getElementById('loading');
            const output = document.getElementById('output');

            btn.disabled = true;
            loading.style.display = 'block';
            output.value = '';

            const data = {
                project_info: document.getElementById('project_info').value,
                style: document.getElementById('style').value,
                instructions: document.getElementById('instructions').value
            };

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                output.value = result.result;
            } catch (error) {
                output.value = "Error generating responose. Is your API key set? Is Ollama running?";
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
